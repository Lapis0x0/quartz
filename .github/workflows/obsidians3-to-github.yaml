name: 同步COS到Obsidian仓库

on:
  # 每 6 小时自动同步一次（UTC 时间）
  schedule:
    - cron: '0 */6 * * *'
  # 允许手动触发
  workflow_dispatch:

jobs:
  sync-from-cos:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ 拉取代码
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 1     # 只拉取最新提交即可，速度更快

      # 2️⃣ 安装并配置 coscli（官方 CLI，支持 sync）
      - name: 安装并配置 coscli
        run: |
          # 下载最新的 coscli
          curl -L https://cos5.cloud.tencent.com/cosfs/coscli/coscli-linux -o coscli
          chmod +x coscli
          sudo mv coscli /usr/local/bin/
          
          # 配置 coscli
          mkdir -p ~/.coscli
          cat > ~/.coscli/config.json << EOF
          {
            "cos_secretid": "${{ secrets.COS_SECRET_ID }}",
            "cos_secretkey": "${{ secrets.COS_SECRET_KEY }}",
            "cos_region": "${{ secrets.COS_REGION }}",
            "cos_bucket": "${{ secrets.COS_BUCKET }}",
            "cos_scheme": "https"
          }
          EOF
          
          # 验证安装
          coscli --version

      # 3️⃣ 从 COS 下载到本地 content/（--delete 保持完全一致）
      - name: 拉取 COS 文件到 content/
        run: |
          mkdir -p content
          coscli sync \
            --thread-num 8 \
            --delete \
            cos://${{ secrets.COS_BUCKET }}/obsidian/数字花园 \
            content/ \
            -e cos.${{ secrets.COS_REGION }}.myqcloud.com
          echo "COS 同步完成 ✅"

      # 4️⃣ 若有变动就提交
      - name: Commit & push if changed
        env:
          TZ: Asia/Shanghai
        run: |
          git config user.name  "COS Sync Bot"
          git config user.email "bot@users.noreply.github.com"

          if [[ -n $(git status --porcelain) ]]; then
            git add -A
            git commit -m "chore: sync notes from COS $(date '+%Y-%m-%d %H:%M:%S')"
            git push
            echo "已检测到变动并推送 🚀"
          else
            echo "没有文件变化，跳过提交 ✔"
          fi
